[project]
name = "braill2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Supreme Khadka", email = "supremekhadkaedu@gmail.com" },
    { name = "Smriti Pant", email = "ssmritip@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.136.3",
    "filetype==1.2.0",
    "httpx2==2.5.0",
    "imagecodecs==2026.6.6",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "numpy==2.4.4",
    "nvitop>=1.7.1",
    "opencv-python==4.10.0.84",
    "pandas>=3.0.3",
    "pillow==12.2.0",
    "psycopg2-binary==2.9.12",
    "pwdlib[argon2]==0.3.0",
    "pyjwt==2.13.0",
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "python-dotenv==1.0.0",
    "pyyaml==6.0.3",
    "sahi==0.11.36",
    "scikit-image==0.26.0",
    "sqlalchemy==2.0.50",
    "sqlmodel==0.0.37",
    "torch",
    "torchvision",
    "ultralytics==8.4.59",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'"}
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
