[project]
name = "braill2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Supreme Khadka", email = "supremekhadkaedu@gmail.com" },
    { name = "Smriti Pant", email = "ssmritip@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9.12",
    "sqlmodel>=0.0.38",
    "torch",
    "torchvision",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'"}
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
